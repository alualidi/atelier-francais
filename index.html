<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2447c4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Atelier de Français</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Concept : une page de cahier Seyès. Les cartes sont des feuilles posées sur le quadrillage,
   les corrections sont au stylo rouge, les bonnes réponses au stylo vert, les titres surlignés. */
:root{
  --paper:#f6f8ff; --grid:#cfd9f6; --grid-soft:#e5ebfd;
  --card:#ffffff; --ink:#18213d; --muted:#53608a; --edge:#c3cdee;
  --blue:#2447c4; --blue-ink:#ffffff; --blue-soft:#e8edff;
  --red:#c42f3a; --red-bg:#fdeced;
  --green:#157548; --green-bg:#e4f5ec;
  --mark:#ffe36e;
  --f-display:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101733; --grid:#26345f; --grid-soft:#192447;
    --card:#18214a; --ink:#e9edfb; --muted:#a4aed2; --edge:#34437a;
    --blue:#9db3ff; --blue-ink:#101a3d; --blue-soft:#24316a;
    --red:#ff959b; --red-bg:#3b2030;
    --green:#74dca9; --green-bg:#163a30;
    --mark:#6a5d1c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101733; --grid:#26345f; --grid-soft:#192447;
  --card:#18214a; --ink:#e9edfb; --muted:#a4aed2; --edge:#34437a;
  --blue:#9db3ff; --blue-ink:#101a3d; --blue-soft:#24316a;
  --red:#ff959b; --red-bg:#3b2030;
  --green:#74dca9; --green-bg:#163a30;
  --mark:#6a5d1c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid-soft) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,32px 8px;
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}

/* Boutons */
.btn{
  border:2px solid var(--blue);background:transparent;color:var(--blue);
  padding:10px 18px;border-radius:8px;font-weight:800;font-size:16px;min-height:46px;
}
.btn:hover{background:var(--blue-soft)}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--blue);font-weight:800;padding:8px 0;text-decoration:underline;text-underline-offset:3px}

/* Accueil */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800}
.hero h1 span{background:linear-gradient(transparent 58%,var(--mark) 58% 92%,transparent 92%);padding:0 6px;margin-left:-6px}
.hero p{max-width:60ch;color:var(--muted);font-size:18px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.how div{background:var(--card);border:1.5px solid var(--edge);border-radius:6px;padding:12px 14px;min-width:0}
.how b{font-family:var(--f-display);display:block;margin-bottom:2px}
.how span{color:var(--muted);font-size:15px}
.sect-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.sect-h h2{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--edge);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--blue-ink)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.lv{background:var(--card);border:1.5px solid var(--edge);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:3px 3px 0 var(--edge)}
.lv-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lv-top .n{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:15px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--blue);display:block}
.dots i.on{background:var(--blue)}
.lv h3{font-size:22px}
.lv p{color:var(--muted);font-size:16px}
.lv .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.best{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.best .st{color:#d49a00;letter-spacing:2px}
.lv-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:6px}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.ex{background:var(--card);border:1.5px dashed var(--edge);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.ex h3{font-size:18px}
.ex p{color:var(--muted);font-size:15px}

/* Séance */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .mid{font-family:var(--f-display);font-weight:700}
.timer{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:2px 14px}
.timer.low{color:var(--red);border-color:var(--red)}
.count{font-weight:800;font-variant-numeric:tabular-nums}
.prog{height:10px;background:var(--card);border:1.5px solid var(--edge);border-radius:6px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--blue)}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:40px;height:40px;border-radius:6px;border:2px solid var(--edge);background:var(--card);font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.grid button.done{background:var(--blue-soft);border-color:var(--blue)}
.grid button.cur{outline:3px solid var(--ink);outline-offset:1px}
.qcard{background:var(--card);border:1.5px solid var(--edge);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:3px 3px 0 var(--edge)}
.tag{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:20px;font-weight:600;line-height:1.5;text-wrap:pretty}
.ptitle{font-size:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.opt{border:2px solid var(--edge);background:var(--card);border-radius:8px;padding:12px 14px;text-align:left;font-size:18px;font-weight:600;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue-soft)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt.good{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-bg);color:var(--red);text-decoration:line-through}
.opt[disabled]{cursor:default;color:inherit}
.opt.good[disabled]{color:var(--green)}
.opt.bad[disabled]{color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:15px;color:var(--muted)}
.field input{border:0;border-bottom:3px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:10px 12px;font-size:20px;font-weight:600;width:100%;max-width:26rem}
.field input.ok,.blank.ok{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.field input.ko,.blank.ko{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.passage{font-size:19px;line-height:2.5;text-wrap:pretty}
.blank{font-size:17px;font-weight:700;border:0;border-bottom:3px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:3px 8px;margin:0 3px;max-width:100%;vertical-align:baseline}
select.blank{padding-right:4px}
input.blank{width:9.5em}
.msg{color:var(--red);font-weight:800}

/* Correction au stylo */
.fb{border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;border:2px solid;min-width:0}
.fb.good{background:var(--green-bg);border-color:var(--green)}
.fb.bad{background:var(--red-bg);border-color:var(--red)}
.fb h3{font-size:24px}
.fb.good h3{color:var(--green)}
.fb.bad h3{color:var(--red)}
.mine .x{color:var(--red);text-decoration:line-through;font-weight:700}
.right b{color:var(--green)}
.why{font-size:17px}
ul.why{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.filled{font-size:18px;line-height:2.1}
.fill{font-weight:800;padding:1px 6px;border-radius:4px}
.fill.ok{color:var(--green);background:var(--green-bg);border-bottom:2px solid var(--green)}
.fill.ko{color:var(--red);background:var(--red-bg);border-bottom:2px solid var(--red)}
.fill.ko s{opacity:.8}
.fill.ko b{color:var(--green)}
.rule{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.rule h4{font-size:18px;display:inline;background:linear-gradient(transparent 58%,var(--mark) 58% 92%,transparent 92%)}
.rule .tag{display:block;margin-bottom:4px}
.rule p{font-size:16px}
.rule ul{margin:0;padding-left:20px;font-size:16px;display:flex;flex-direction:column;gap:2px}
.rule em{font-style:normal;background:var(--blue-soft);padding:0 4px;border-radius:3px}
details.rd{border:1.5px solid var(--edge);border-radius:6px;background:var(--card);padding:0}
details.rd>summary{cursor:pointer;padding:12px 14px;font-weight:800;font-family:var(--f-display);font-size:17px}
details.rd>.rule{border:0;border-top:1.5px solid var(--edge);border-radius:0 0 6px 6px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions .sp{flex:1}
.notice{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* Résultats */
.score{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.score .big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,10vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:.45em;color:var(--muted)}
.score .st{font-size:34px;color:#d49a00;letter-spacing:4px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr 70px;gap:10px;align-items:center;font-size:15px;font-weight:700}
.bar-row .m{height:14px;border:1.5px solid var(--ink);border-radius:4px;background:var(--card);overflow:hidden}
.bar-row .m span{display:block;height:100%;background:var(--blue)}
.bar-row .v{font-variant-numeric:tabular-nums;text-align:right}
.corr{display:flex;flex-direction:column;gap:14px}
.corr-item{background:var(--card);border:1.5px solid var(--edge);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.corr-item.okk{border-color:var(--green)}
.corr-item .q{font-size:18px}
.mark{font-family:var(--f-display);font-weight:800}
.mark.o{color:var(--green)}
.mark.k{color:var(--red)}
.empty{color:var(--muted)}

/* Fiches */
.cat{display:flex;flex-direction:column;gap:10px}
.cat h2{font-size:22px}

@media (max-width:560px){
  body{font-size:16px}
  .qcard{padding:16px}
  .q{font-size:19px}
  .bar-row{grid-template-columns:1fr 60px}
  .bar-row .m{grid-column:1 / -1;grid-row:2}
  .bar-row .v{grid-row:1;grid-column:2}
}
@media (prefers-reduced-motion:no-preference){
  .fb{animation:pop .25s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.seg button{border:2px solid var(--edge);background:var(--card);border-radius:8px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.seg button span{color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.pill{font-family:var(--f-body);font-size:13px;font-weight:800;border:1.5px solid var(--edge);border-radius:999px;padding:1px 10px;color:var(--muted);vertical-align:middle}
.pill.on{color:var(--green);border-color:var(--green);background:var(--green-bg)}
.pill.warn{color:var(--red);border-color:var(--red)}
.panel{background:var(--card);border:1.5px solid var(--edge);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:3px 3px 0 var(--edge)}
.panel h2{font-size:21px}
.small{font-size:15px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:6px}
.form.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.form label,.row label{font-weight:800;font-size:15px;color:var(--muted)}
.panel input[type=text],.panel input[type=password],.panel select,.panel textarea{border:2px solid var(--edge);background:var(--paper);border-radius:8px;padding:10px 12px;font-size:17px;width:100%;min-height:48px;color:var(--ink)}
.panel textarea{font-family:ui-monospace,monospace;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row input{max-width:9rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:24px;height:24px;flex:none}
.status{font-weight:700;color:var(--ink);background:var(--blue-soft);border-radius:6px;padding:8px 12px}
.warnbox{border-color:var(--red)}
.btn,.chip,.opt,.link{touch-action:manipulation}
@media (min-width:900px){body{font-size:18px}.q{font-size:22px}.opt{font-size:20px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var THEMES = {passe:"Temps du passé", conj:"Conjugaison", ortho:"Orthographe", gram:"Grammaire et vocabulaire"};
var THEME_ORDER = ["passe","conj","ortho","gram"];

var RULES = {
tps:{t:"Reconnaître le temps d’une phrase",c:"passe",
 x:"Pour trouver le temps, regarde le verbe et les mots qui indiquent le moment. <b>Hier, la semaine dernière, autrefois</b> → passé. <b>Maintenant, aujourd’hui</b> → présent. <b>Demain, bientôt, dans deux jours</b> → futur. Le <b>passé composé</b> s’écrit en deux mots (avoir ou être + participe passé). L’<b>imparfait</b> se termine par -ais, -ait, -ions, -iez, -aient. Le <b>futur</b> se termine par -rai, -ras, -ra, -rons, -rez, -ront.",
 e:["Hier, nous avons joué. (passé composé)","Elle chantait souvent. (imparfait)","Demain, tu partiras. (futur)"]},
impPC:{t:"Imparfait ou passé composé ?",c:"passe",
 x:"<b>L’imparfait</b> sert à décrire (le décor, la météo, un personnage), à dire ce qui se passait d’habitude ou ce qui durait. <b>Le passé composé</b> raconte les actions précises et terminées qui font avancer l’histoire. Astuce : <b>imparfait = décor, passé composé = action</b>. Mots repères : <em>souvent, toujours, chaque jour, pendant que, à cette époque</em> → imparfait ; <em>soudain, tout à coup, hier, un jour, ce matin, puis</em> → passé composé.",
 e:["Il faisait beau et les oiseaux chantaient. (décor)","Chaque été, nous allions à la mer. (habitude)","Soudain, un chien a aboyé. (action précise)"]},
inter:{t:"Une action en interrompt une autre",c:"passe",
 x:"Quand une action est en train de se dérouler et qu’une autre arrive d’un coup, on utilise <b>l’imparfait pour l’action en cours</b> et <b>le passé composé pour celle qui l’interrompt</b>. Deux actions qui durent en même temps (pendant que…) sont toutes les deux à l’imparfait.",
 e:["Je lisais quand le téléphone a sonné.","Pendant que maman cuisinait, je faisais mes devoirs."]},
impForm:{t:"Former l’imparfait",c:"passe",
 x:"On prend le verbe au présent avec <b>nous</b>, on enlève <b>-ons</b>, puis on ajoute <b>-ais, -ais, -ait, -ions, -iez, -aient</b>. Exception : <b>être</b> → j’étais. Verbes en -ger : je mange<b>ais</b> (le e garde le son de « j »), mais nous mangions. Verbes en -cer : je commen<b>ç</b>ais, mais nous commencions.",
 e:["nous finissons → je finissais, nous finissions","nous mangeons → je mangeais, nous mangions","être → j’étais, vous étiez"]},
pcForm:{t:"Former le passé composé",c:"passe",
 x:"Passé composé = <b>avoir ou être au présent</b> + <b>participe passé</b>. Participes passés : verbes en -er → <b>é</b> (chanté) ; verbes en -ir → <b>i</b> (fini). Irréguliers à connaître : avoir → eu, être → été, faire → fait, prendre → pris, mettre → mis, dire → dit, écrire → écrit, voir → vu, pouvoir → pu, vouloir → voulu, devoir → dû, ouvrir → ouvert.",
 e:["J’ai pris le bus.","Nous avons fini à midi.","Elle a fait un gâteau."]},
auxEtre:{t:"Avoir ou être ?",c:"passe",
 x:"La plupart des verbes utilisent <b>avoir</b>. On utilise <b>être</b> avec : <em>aller, venir, arriver, partir, entrer, sortir, monter, descendre, tomber, rester, naître, mourir, retourner</em> et avec <b>tous les verbes pronominaux</b> (se lever, s’habiller…). Astuce : si le verbe se conjugue avec « se », c’est être.",
 e:["Il est parti hier.","Nous sommes arrivés en retard.","Elle s’est levée tôt.","Mais : J’ai mangé une pomme."]},
ppAccord:{t:"Accorder le participe passé",c:"passe",
 x:"Avec <b>être</b>, le participe passé s’accorde avec le <b>sujet</b> (féminin : e ; pluriel : s). Avec <b>avoir</b>, il ne s’accorde pas avec le sujet : il s’accorde seulement avec le COD s’il est <b>placé avant</b> le verbe. Avec un verbe pronominal, on regarde où est le COD : elle s’est lavée (pas de COD après) ; elle s’est lavé les mains (COD « les mains » après le verbe).",
 e:["Mes amies sont arrivées.","Léa a perdu ses clés.","La lettre que j’ai écrite est partie.","Elle s’est cassé la jambe."]},
pqp:{t:"Le plus-que-parfait",c:"passe",
 x:"On l’utilise pour une action <b>déjà terminée avant</b> une autre action du passé. On le forme avec l’<b>imparfait de avoir ou être</b> + le participe passé. Mots repères : <em>déjà, la veille, avant, auparavant</em>.",
 e:["Quand je suis arrivé, le film avait déjà commencé.","La veille, elle avait préparé les gâteaux.","Nous étions partis avant la pluie."]},
futur:{t:"Le futur simple",c:"conj",
 x:"Pour la plupart des verbes : <b>infinitif + -ai, -as, -a, -ons, -ez, -ont</b> (je chanterai, tu finiras). Verbes en -re : on enlève le e (il prendra). Radicaux à connaître : <b>être</b> → ser-, <b>avoir</b> → aur-, <b>aller</b> → ir-, <b>faire</b> → fer-, <b>pouvoir</b> → pourr-, <b>voir</b> → verr-, <b>venir</b> → viendr-, <b>vouloir</b> → voudr-.",
 e:["Demain, je serai en retard.","Vous pourrez venir.","Ils viendront à midi."]},
condit:{t:"Le conditionnel présent",c:"conj",
 x:"On l’emploie après <b>si + imparfait</b> pour dire ce qui arriverait. Il se forme avec le radical du futur + les terminaisons de l’imparfait : <b>-ais, -ais, -ait, -ions, -iez, -aient</b>. Après « si », on n’écrit jamais de conditionnel ni de futur.",
 e:["Si j’avais le temps, je viendrais.","Si tu étais là, nous jouerions."]},
presIrr:{t:"Le présent des verbes irréguliers",c:"conj",
 x:"À connaître par cœur. <b>être</b> : je suis, tu es, il est, nous sommes, vous êtes, ils sont. <b>avoir</b> : j’ai, tu as, il a, nous avons, vous avez, ils ont. <b>aller</b> : je vais, tu vas, il va, nous allons, vous allez, ils vont. <b>faire</b> : vous faites, ils font. <b>dire</b> : vous dites. <b>pouvoir</b> : je peux, tu peux, il peut, ils peuvent. <b>prendre</b> : nous prenons, ils prennent.",
 e:["Vous faites du bruit.","Ils peuvent venir."]},
hom_a:{t:"a ou à ?",c:"ortho",
 x:"<b>a</b> = verbe avoir : on peut dire « avait ». <b>à</b> = préposition : on ne peut pas dire « avait ».",
 e:["Léa a un chat. (Léa avait un chat)","Elle va à l’école."]},
hom_et:{t:"et ou est ?",c:"ortho",
 x:"<b>est</b> = verbe être : on peut dire « était ». <b>et</b> = « et puis » : il relie deux mots ou deux phrases.",
 e:["Le ciel est bleu. (Le ciel était bleu)","Tom et Léa jouent."]},
hom_son:{t:"son ou sont ?",c:"ortho",
 x:"<b>sont</b> = verbe être : on peut dire « étaient ». <b>son</b> = déterminant : on peut dire « mon » ou « ton ».",
 e:["Ils sont partis. (Ils étaient partis)","Il range son sac. (Il range mon sac)"]},
hom_on:{t:"on ou ont ?",c:"ortho",
 x:"<b>ont</b> = verbe avoir : on peut dire « avaient ». <b>on</b> = pronom : on peut dire « il » ou « nous ».",
 e:["Ils ont gagné. (Ils avaient gagné)","On mange à midi. (Il mange à midi)"]},
hom_ce:{t:"ce ou se ?",c:"ortho",
 x:"<b>se</b> se place devant un verbe (se laver, se lever). <b>ce</b> se place devant un nom (ce livre) ou veut dire « cela ».",
 e:["Il se lave les mains.","Ce livre est passionnant."]},
hom_ces:{t:"ces ou ses ?",c:"ortho",
 x:"<b>ces</b> sert à montrer : on peut ajouter -ci ou -là (ces livres-là). <b>ses</b> veut dire « à lui » ou « à elle » : on peut dire « mes » ou « tes ».",
 e:["Ces fleurs sont jolies.","Léa range ses affaires. (Léa range mes affaires)"]},
hom_leur:{t:"leur ou leurs ?",c:"ortho",
 x:"<b>leur</b> devant un nom singulier (leur maison), ou devant un verbe : « je leur parle » (jamais de s). <b>leurs</b> devant un nom pluriel (leurs jouets).",
 e:["Ils aiment leur jardin.","Ils rangent leurs jouets."]},
hom_ou:{t:"ou ou où ?",c:"ortho",
 x:"<b>où</b> indique un lieu ou un moment : on ne peut pas dire « ou bien ». <b>ou</b> = « ou bien » : il propose un choix.",
 e:["Où habites-tu ?","Veux-tu du thé ou du café ?"]},
hom_quel:{t:"quel, quelle ou qu’elle ?",c:"ortho",
 x:"<b>quel, quelle, quels, quelles</b> s’accordent avec le nom (quelle heure ?). <b>qu’elle</b> = « que » + « elle » : on peut dire « qu’il ».",
 e:["Quelle belle journée !","Je crois qu’elle viendra. (Je crois qu’il viendra)"]},
hom_peu:{t:"peu, peut ou peux ?",c:"ortho",
 x:"<b>peu</b> = pas beaucoup (il mange peu). <b>peut</b> et <b>peux</b> sont le verbe pouvoir : on peut dire « pouvait ». Je peux, tu peux, il peut.",
 e:["Il mange peu.","Il peut venir. (Il pouvait venir)"]},
hom_pret:{t:"prêt ou près ?",c:"ortho",
 x:"<b>prêt</b> (prête, prêts, prêtes) veut dire « préparé » et s’accorde. <b>près</b> veut dire « pas loin » et ne change jamais.",
 e:["Elle est prête à partir.","La gare est près de chez moi."]},
hom_plus:{t:"plus tôt ou plutôt ?",c:"ortho",
 x:"<b>plus tôt</b> = le contraire de « plus tard ». <b>plutôt</b> = « de préférence » ou « assez ».",
 e:["Je me lève plus tôt demain.","Je prends plutôt du thé."]},
gn:{t:"Accorder dans le groupe nominal",c:"ortho",
 x:"Le déterminant, le nom et l’adjectif s’accordent en <b>genre</b> et en <b>nombre</b>. Pluriel : on ajoute <b>-s</b>. Les noms en -al font -aux (un journal → des journaux). Féminin : on ajoute souvent un <b>e</b> (voisin → voisine). Les mots en -teur font souvent -trice (lecteur → lectrice).",
 e:["des fleurs rouges","un cheval blanc → des chevaux blancs","un lecteur attentif → une lectrice attentive"]},
sv:{t:"Accorder le verbe avec son sujet",c:"ortho",
 x:"Le verbe s’accorde avec le <b>sujet</b>, même s’il en est éloigné. Pour trouver le sujet, pose la question « Qui est-ce qui ? » devant le verbe. Deux sujets (Léo et Jules) → pluriel. Avec « mes parents et moi », on utilise <b>nous</b>.",
 e:["Les élèves de ma classe vont au musée. (Qui va ? Les élèves)","Mes parents et moi partirons demain."]},
pron:{t:"Les pronoms personnels",c:"gram",
 x:"Un pronom remplace un groupe de mots. <b>Il, elle, ils, elles</b> remplacent le sujet. <b>Le, la, les</b> remplacent un COD : je regarde le film → je <b>le</b> regarde. <b>Lui, leur</b> remplacent un COI : je parle à Paul → je <b>lui</b> parle. Quand il y a les deux : je <b>le lui</b> donne.",
 e:["Marie mange une pomme. → Elle mange une pomme.","Je regarde le film. → Je le regarde.","Je parle à mes amis. → Je leur parle."]},
fonc:{t:"Les compléments de la phrase",c:"gram",
 x:"Le <b>COD</b> répond à « quoi ? » ou « qui ? » après le verbe, sans préposition. Le <b>COI</b> répond à « à qui ? à quoi ? de quoi ? ». Le <b>complément circonstanciel</b> (temps, lieu, manière) peut se déplacer ou disparaître sans que la phrase perde son sens.",
 e:["Léo mange une pomme. (COD : une pomme)","Hier soir, Léa lit dans sa chambre. (hier soir : temps ; dans sa chambre : lieu)"]},
voc:{t:"Synonymes et contraires",c:"gram",
 x:"Un <b>synonyme</b> a presque le même sens (joli = beau). Un <b>contraire</b> a le sens opposé (chaud ↔ froid). On forme souvent des contraires avec les préfixes <b>in-, im-, dé-, mal-</b> : possible → impossible, faire → défaire. Devant b, m, p, on écrit <b>im-</b>.",
 e:["peureux ↔ courageux","possible → impossible","heureux ↔ malheureux"]},
fam:{t:"Les familles de mots",c:"gram",
 x:"Les mots d’une même famille partagent un <b>radical</b> et un sens commun. On ajoute un préfixe (re-, dé-) ou un suffixe (-eur, -ation, -ette) au radical. Attention aux intrus qui ressemblent à la famille mais n’en font pas partie.",
 e:["terre : terrain, terrasse, atterrir, enterrer","porter : transporter, portable, apporter"]}
};

function Q(l,t,r,q,o,a,w){BANK.push({id:BANK.length,l:l,t:t,r:r,k:"qcm",q:q,o:o,a:a,w:w});}
function F(l,t,r,q,a,w){BANK.push({id:BANK.length,l:l,t:t,r:r,k:"fill",q:q,a:a,w:w});}

/* ===================== NIVEAU 1 · Échauffement ===================== */
Q(1,"passe","tps","Hier, nous avons mangé une pizza. Quel est le temps du verbe ?",["présent","passé composé","futur simple"],1,"« avons mangé » est formé de avoir (au présent) + un participe passé. Avec « hier », on sait que c’est le passé : c’est le passé composé.");
Q(1,"passe","tps","Quand j’étais petit, j’habitais à la campagne. Quel est le temps du verbe « habitais » ?",["imparfait","passé composé","futur simple"],0,"« habitais » se termine par -ais et ne s’écrit qu’en un mot : c’est de l’imparfait. Il décrit où je vivais à cette époque.");
Q(1,"passe","pcForm","Complète : « Elle ___ une glace. »",["a mangé","est mangé","à mangé"],0,"Manger se conjugue avec avoir : elle a mangé. Et on écrit « a » sans accent, car on peut dire « elle avait mangé ».");
Q(1,"passe","auxEtre","Complète : « Hier, mon frère ___ à la piscine. »",["a allé","est allé","es allé"],1,"Aller fait partie des verbes qui se conjuguent avec être. Pour « mon frère » (il), on écrit : il est allé.");
F(1,"passe","impForm","Écris le verbe à l’imparfait : « Quand j’étais petit, je (jouer) ___ tout le temps dehors. »",["jouais"],"On écrit « je jouais » : le radical jou- + la terminaison -ais pour « je ».");
F(1,"passe","impForm","Écris le verbe à l’imparfait : « Chaque soir, nous (finir) ___ nos devoirs avant le dîner. »",["finissions"],"Au présent, « nous finissons » : on garde finiss- et on ajoute -ions. « Chaque soir » indique une habitude, donc l’imparfait.");
F(1,"passe","pcForm","Écris le verbe au passé composé : « Hier, j’ (prendre) ___ le bus. »",["ai pris"],"Prendre se conjugue avec avoir : j’ai + le participe passé « pris ». Ce participe est irrégulier.");
F(1,"passe","auxEtre","Écris le verbe au passé composé : « Samedi, Léa (aller) ___ au cinéma. »",["est allée"],"Aller se conjugue avec être. Le participe s’accorde avec le sujet : Léa est une fille, on ajoute un e : « est allée ».");
Q(1,"passe","impPC","Quel mot annonce un événement précis (passé composé) ?",["soudain","souvent","toujours"],0,"« Soudain » annonce quelque chose qui arrive d’un coup : passé composé. « Souvent » et « toujours » indiquent une habitude : imparfait.");
Q(1,"passe","impPC","Complète : « Quand j’étais petit, chaque matin, mon père ___ le journal. »",["lisait","a lu","lit"],0,"« Chaque matin » indique une habitude dans le passé : on utilise l’imparfait.");
Q(1,"passe","pcForm","Quel est le participe passé du verbe « prendre » ?",["pris","prendu","prenu"],0,"Le participe passé de prendre est irrégulier : pris, comme mis, fait, dit, vu. Il faut le connaître par cœur.");
Q(1,"passe","auxEtre","Complète : « Hier, la pluie ___ tombée toute la journée. »",["est","a"],0,"Tomber se conjugue avec être : la pluie est tombée. Le participe s’accorde avec « la pluie » (féminin).");
Q(1,"passe","impForm","Quelle forme est à l’imparfait ?",["nous chantons","nous chantions","nous chanterons"],1,"L’imparfait avec « nous » se termine par -ions : nous chantions. « chantons » est du présent, « chanterons » du futur.");
Q(1,"conj","futur","Complète : « Demain, je ___ au parc. »",["irai","vais","allais"],0,"« Demain » annonce le futur. Le futur d’aller est irrégulier : j’irai.");
F(1,"conj","futur","Écris le verbe au futur : « Demain, tu (avoir) ___ beaucoup de devoirs. »",["auras"],"Avoir au futur : j’aurai, tu auras… Le radical est aur-.");
Q(1,"conj","presIrr","Comment s’écrit « faire » avec « vous » au présent ?",["vous faites","vous faisez","vous fesez"],0,"Faire est irrégulier : vous faites (comme vous dites). La terminaison n’est pas -ez comme pour les verbes en -er.");
F(1,"conj","presIrr","Écris le verbe au présent : « Ils (pouvoir) ___ venir ce soir. »",["peuvent"],"Pouvoir : je peux, tu peux, il peut, nous pouvons, vous pouvez, ils peuvent.");
Q(1,"ortho","hom_a","Complète : « Léa ___ de la chance. »",["a","à"],0,"On peut dire « Léa avait de la chance » : c’est le verbe avoir, donc « a » sans accent.");
Q(1,"ortho","hom_et","Complète : « Mon père ___ grand. »",["est","et"],0,"On peut dire « mon père était grand » : c’est le verbe être, donc « est ».");
Q(1,"ortho","hom_on","Complète : « Les élèves ___ fini leur travail. »",["ont","on"],0,"On peut dire « les élèves avaient fini » : c’est le verbe avoir, donc « ont ».");
Q(1,"ortho","hom_son","Complète : « Ils ___ très contents. »",["sont","son"],0,"On peut dire « ils étaient contents » : c’est le verbe être, donc « sont ».");
Q(1,"ortho","hom_ce","Complète : « Il ___ lève tôt. »",["se","ce"],0,"« se lever » est un verbe pronominal : « se » se place devant le verbe.");
Q(1,"ortho","gn","Quel groupe nominal est bien écrit ?",["des fleurs rouges","des fleur rouges","des fleurs rouge"],0,"Le déterminant, le nom et l’adjectif sont tous au pluriel : des fleurs rouges.");
Q(1,"gram","fonc","Dans « Les enfants jouent dans la cour. », quel est le sujet ?",["Les enfants","jouent","dans la cour"],0,"Pour trouver le sujet, on demande : « Qui est-ce qui joue ? » → les enfants.");
Q(1,"gram","pron","Remplace « Marie » par un pronom : « Marie mange une pomme. »",["Elle","Il","Elles"],0,"Marie est une seule fille : on utilise « elle ».");
Q(1,"gram","voc","Quel est le contraire de « courageux » ?",["peureux","fort","grand"],0,"Courageux et peureux ont des sens opposés.");
Q(1,"gram","voc","Quel mot est un synonyme de « apercevoir » ?",["remarquer","oublier","entendre"],0,"Apercevoir veut dire voir, remarquer quelque chose rapidement.");

/* ===================== NIVEAU 2 · Je choisis le bon temps ===================== */
Q(2,"passe","inter","Complète : « Je ___ (lire) quand le téléphone ___ (sonner). »",["lisais … a sonné","ai lu … sonnait","lisais … sonnait"],0,"Une action est en cours (je lisais, imparfait) quand une autre l’interrompt d’un coup (le téléphone a sonné, passé composé).");
Q(2,"passe","inter","Complète : « Nous ___ (jouer) dehors quand l’orage ___ (éclater). »",["jouions … a éclaté","avons joué … éclatait","jouions … éclatait"],0,"« jouions » est l’action en cours ; « a éclaté » est l’événement soudain qui l’interrompt.");
Q(2,"passe","impPC","Complète : « Chaque été, nous ___ (aller) chez mamie. Un été, nous y ___ (rester) un mois entier. »",["allions … sommes restés","sommes allés … restions","allions … restions"],0,"« Chaque été » : habitude → imparfait (allions). « Un été » : événement précis → passé composé (sommes restés, avec être).");
F(2,"passe","auxEtre","Écris au passé composé : « Ce matin, je (se réveiller) ___ à sept heures. » (Écris au féminin ou au masculin.)",["me suis réveillé","me suis réveillée"],"Les verbes pronominaux se conjuguent avec être : je me suis réveillé(e).");
Q(2,"passe","inter","Complète : « Pendant que maman ___ (cuisiner), je ___ (faire) mes devoirs. »",["cuisinait … faisais","a cuisiné … ai fait","cuisinait … ai fait"],0,"« Pendant que » relie deux actions qui durent en même temps : les deux verbes sont à l’imparfait.");
F(2,"passe","auxEtre","Écris au passé composé : « Soudain, la porte (s’ouvrir) ___ . »",["s’est ouverte"],"« Soudain » annonce un passé composé. S’ouvrir est pronominal : on utilise être, et le participe s’accorde avec « la porte » (féminin) : s’est ouverte.");
Q(2,"passe","impPC","Complète : « Le ciel ___ (être) gris et il ___ (faire) froid. »",["était … faisait","a été … a fait","était … a fait"],0,"On décrit le décor (le ciel, la température) : imparfait.");
Q(2,"passe","impPC","Complète : « Hier, nous ___ (visiter) le château et nous ___ (prendre) des photos. »",["avons visité … avons pris","visitions … prenions","avons visité … prenions"],0,"Ce sont deux actions précises et terminées qui s’enchaînent : passé composé pour les deux.");
F(2,"passe","impForm","Écris à l’imparfait : « Quand j’étais petite, je (dormir) ___ avec une veilleuse. »",["dormais"],"C’est une habitude dans le passé : imparfait. Nous dormons → je dormais.");
F(2,"passe","impPC","Écris au passé composé : « Un jour, mon chat (disparaître) ___ . »",["a disparu"],"« Un jour » annonce un événement précis. Disparaître se conjugue ici avec avoir ; le participe passé est « disparu » : il a disparu.");
F(2,"passe","auxEtre","Écris au passé composé : « Tout à coup, les lumières (s’éteindre) ___ . »",["se sont éteintes"],"« Tout à coup » annonce un événement soudain. Verbe pronominal : être. Le participe s’accorde avec « les lumières » (féminin pluriel) : se sont éteintes.");
Q(2,"passe","impPC","Quel groupe de mots annonce plutôt un imparfait ?",["d’habitude","soudain","hier soir"],0,"« D’habitude » parle de ce qui se passait régulièrement : imparfait. « Soudain » et « hier soir » annoncent un événement précis : passé composé.");
Q(2,"passe","impPC","Complète : « Pendant les vacances, Tom ___ (se lever) tard tous les jours. »",["se levait","s’est levé","se lève"],0,"« Tous les jours » indique une habitude dans le passé : imparfait.");
Q(2,"passe","auxEtre","Complète : « Elles ___ parties tôt. »",["sont","ont"],0,"Partir se conjugue avec être : elles sont parties.");
Q(2,"passe","ppAccord","Complète : « Mes amies sont ___ hier. »",["arrivées","arrivés","arrivé"],0,"Avec être, le participe passé s’accorde avec le sujet : « mes amies » est féminin pluriel → arrivées.");
Q(2,"passe","ppAccord","Complète : « Léa a ___ ses clés. »",["perdu","perdue","perdus"],0,"Avec avoir, le participe passé ne s’accorde pas avec le sujet. Le COD « ses clés » est placé après le verbe : on écrit « perdu ».");
Q(2,"passe","impForm","Complète à l’imparfait : « Autrefois, vous ___ (manger) beaucoup de bonbons. »",["mangiez","mangeiez","mangez"],0,"Avec « vous », la terminaison de l’imparfait est -iez : vous mangiez. Le e de « mangeais » n’est pas utile devant un i.");
F(2,"passe","impForm","Écris à l’imparfait : « Je (manger) ___ toujours vite. »",["mangeais"],"Devant la lettre a, on garde un e après le g pour conserver le son de « j » : je mangeais.");
F(2,"passe","impForm","Écris à l’imparfait : « Nous (commencer) ___ à huit heures. »",["commencions"],"Devant -ions, le c reste un c (nous commencions). On écrit ç seulement devant a, o ou u : je commençais.");
F(2,"conj","futur","Écris au futur : « Nous (finir) ___ bientôt. »",["finirons"],"Futur : infinitif + terminaison. Finir + ons → nous finirons.");
F(2,"conj","presIrr","Écris au présent : « Vous (dire) ___ la vérité. »",["dites"],"Dire est irrégulier : vous dites (et non « disez »).");
Q(2,"ortho","hom_ces","Complète : « Léa range ___ affaires. »",["ses","ces"],0,"On peut dire « mes affaires » : ce sont les affaires de Léa, donc « ses ».");
Q(2,"ortho","hom_leur","Complète : « Les enfants rangent ___ jouets. »",["leurs","leur"],0,"Le nom « jouets » est au pluriel : « leurs » prend un s.");
Q(2,"ortho","hom_ou","Complète : « ___ habites-tu ? »",["Où","Ou"],0,"On parle d’un lieu et on ne peut pas dire « ou bien » : on écrit « où » avec un accent.");
Q(2,"ortho","hom_a","Complète : « Il a mal ___ la tête. »",["à","a"],0,"On ne peut pas dire « il a mal avait la tête » : c’est la préposition « à ».");
Q(2,"gram","pron","Remplace « Marie et moi » par un pronom.",["nous","elles","vous"],0,"« Marie et moi » : plusieurs personnes dont moi → nous.");
Q(2,"gram","fonc","Dans « Léo mange une pomme. », quel groupe est le COD ?",["une pomme","Léo","mange"],0,"On pose la question « Léo mange quoi ? » → une pomme.");
Q(2,"gram","voc","Quel est le contraire de « possible » ?",["impossible","inpossible","malpossible"],0,"Devant un p, le préfixe s’écrit im- : impossible.");
Q(2,"gram","voc","Quel mot est un synonyme de « se dépêcher » ?",["se presser","s’arrêter","rester"],0,"Se dépêcher veut dire se presser, aller vite.");

var SYSTEM_PROMPT="Tu es un enseignant de français qui crée des exercices pour une élève de 10 ans (école primaire de Suisse romande, degrés 7P-8P, et un peu au-delà). Tu réponds UNIQUEMENT par un tableau JSON valide, sans aucun texte autour et sans balises de code. Chaque exercice a UNE seule bonne réponse, sans ambiguïté : si deux temps verbaux étaient possibles, change la phrase ou ajoute un indice de temps (soudain, chaque jour, la veille, pendant que…). Les phrases parlent de la vie d’un enfant, sont variées et correctes. Les explications (champ w) font 1 à 3 phrases simples adressées à l’enfant et nomment la règle. Utilise l’apostrophe typographique ’ et les guillemets « ». Aucun contenu sensible, aucune marque.";
function buildPrompt(level,theme,n,weak){
  var rules=Object.keys(RULES).map(function(id){return id+" = "+RULES[id].t;}).join(" ; ");
  var p="Crée "+n+" exercices de français de niveau "+level+" sur 4 : "+LEVELS[level].n+" — "+LEVELS[level].d+" L’élève réussit déjà très bien le niveau précédent : sois exigeant, avec des pièges raisonnables.\n";
  p+="Thème : "+(theme==="all"?"tous les thèmes, avec une majorité d’exercices sur les temps du passé (imparfait, passé composé, plus-que-parfait)":THEMES[theme])+".\n";
  if(weak.length)p+="Insiste sur ces règles où l’élève se trompe : "+weak.map(function(r){return RULES[r].t;}).join(" ; ")+".\n";
  p+="Mélange ces trois formats :\n";
  p+='1) QCM : {"k":"qcm","theme":"passe","rule":"impPC","q":"Complète : « Soudain, la porte ___ (s’ouvrir). »","o":["s’est ouverte","s’ouvrait","s’ouvre"],"w":"explication"} — o[0] est TOUJOURS la bonne réponse, suivie de 1 à 3 mauvaises réponses plausibles.\n';
  p+='2) Réponse à écrire : {"k":"fill","theme":"conj","rule":"futur","q":"Écris au futur : « Demain, nous (voir) ___ la mer. »","a":["verrons"],"w":"explication"} — a contient la réponse attendue (et les variantes acceptables).\n';
  if(level>=3)p+='3) Récit à trous (inclus-en au moins 2) : {"k":"pass","theme":"passe","rule":"impPC","title":"Titre court","x":"Ce matin-là, il {1} (faire) beau. Tom {2} (marcher) quand soudain un chien {3} (aboyer).","b":[{"o":["faisait","a fait","fait"],"w":"explication"},{"o":["marchait","a marché","marche"],"w":"explication"},{"o":["a aboyé","aboyait","avait aboyé"],"w":"explication"}]} — 5 à 8 trous numérotés {1}, {2}…, un seul temps correct par trou, o[0] est la bonne réponse. Possibilité d’un trou à écrire : {\"a\":[\"réponse\"],\"w\":\"…\"}.\n';
  else p+='(Pas de récit à trous pour ce niveau.)\n';
  p+="Valeurs autorisées pour theme : passe (temps du passé), conj (conjugaison), ortho (orthographe), gram (grammaire et vocabulaire). Valeurs autorisées pour rule : "+rules+".\n";
  p+="Renvoie le tableau JSON des exercices, rien d’autre.";
  return p;
}
function api(prompt,maxTokens){
  var key=mem.set.key,model=mem.set.model||DEFAULT_MODEL;
  return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:model,max_tokens:maxTokens,system:SYSTEM_PROMPT,messages:[{role:"user",content:prompt}]})}).then(function(r){
    if(!r.ok)return r.text().then(function(t){var m="";try{m=JSON.parse(t).error.message;}catch(e){}throw new Error(r.status===401?"Clé refusée par Anthropic (vérifie la clé).":r.status===429?"Trop de demandes, réessaie dans une minute.":"Erreur "+r.status+(m?" : "+m:""));});
    return r.json();
  }).then(function(j){return (j.content||[]).filter(function(c){return c.type==="text";}).map(function(c){return c.text;}).join("");},function(e){if(e instanceof TypeError)throw new Error("Pas de connexion à internet.");throw e;});
}
var DEF_RULE={passe:"impPC",conj:"futur",ortho:"gn",gram:"fonc"};
function str(v,max){return typeof v==="string"&&v.trim()&&v.length<=max?v.trim():null;}
function cleanQ(it,level,idx){
  if(!it||typeof it!=="object")return null;
  var t=THEMES[it.theme]?it.theme:"passe";
  var r=RULES[it.rule]?it.rule:DEF_RULE[t];
  var id="c"+Date.now().toString(36)+idx,q;
  if(it.k==="qcm"){
    var o=Array.isArray(it.o)?it.o.map(function(x){return str(x,90);}).filter(Boolean):[];
    var uniq=o.filter(function(x,i){return o.indexOf(x)===i;});
    var qq=str(it.q,320),w=str(it.w,500);
    if(!qq||!w||uniq.length<2||uniq.length>4)return null;
    q={k:"qcm",q:qq,o:uniq,a:0,w:w};
  } else if(it.k==="fill"){
    var a=Array.isArray(it.a)?it.a.map(function(x){return str(x,80);}).filter(Boolean):[];
    var q2=str(it.q,320),w2=str(it.w,500);
    if(!q2||!w2||!a.length||a.length>4)return null;
    q={k:"fill",q:q2,a:a,w:w2};
  } else if(it.k==="pass"){
    var x=str(it.x,1500),b=Array.isArray(it.b)?it.b:null;
    if(!x||!b||b.length<3||b.length>9)return null;
    var bl=[];
    for(var i=0;i<b.length;i++){
      if(x.indexOf("{"+(i+1)+"}")<0)return null;
      var ww=str(b[i]&&b[i].w,400);if(!ww)return null;
      if(Array.isArray(b[i].o)){
        var oo=b[i].o.map(function(z){return str(z,60);}).filter(Boolean);
        if(oo.length<2||oo.length>4||oo.filter(function(z,k){return oo.indexOf(z)===k;}).length!==oo.length)return null;
        bl.push({o:oo,a:0,w:ww});
      } else if(Array.isArray(b[i].a)){
        var aa=b[i].a.map(function(z){return str(z,60);}).filter(Boolean);
        if(!aa.length)return null;
        bl.push({a:aa,w:ww});
      } else return null;
    }
    if((x.match(/\{\d+\}/g)||[]).length!==b.length)return null;
    q={k:"pass",title:str(it.title,60)||"Récit",x:x,b:bl};
  } else return null;
  q.id=id;q.l=level;q.t=t;q.r=r;q.claude=true;
  return q;
}
function parseJSON(txt){
  var s=txt.indexOf("["),e=txt.lastIndexOf("]");
  if(s<0||e<s)throw new Error("Réponse inattendue de Claude. Réessaie.");
  try{return JSON.parse(txt.slice(s,e+1));}catch(err){throw new Error("Réponse de Claude illisible. Réessaie.");}
}
function genRun(){
  var level=+(PF.level||"2"),theme=PF.theme||"all",n=+(PF.n||"12");
  var weak=(PF.weak!==false)?weakRules():[];
  PF.busy=true;PF.gmsg="Claude prépare les exercices (jusqu’à une minute)…";PF.newCount=0;render();
  api(buildPrompt(level,theme,n,weak),Math.min(8000,n*450+1200)).then(function(txt){
    var arr=parseJSON(txt),out=[],keys={};
    mem.extra.forEach(function(q){keys[qkey(q)]=1;});
    arr.forEach(function(it,i){var q=cleanQ(it,level,i);if(q&&!keys[qkey(q)]){keys[qkey(q)]=1;out.push(q);}});
    if(!out.length)throw new Error("Aucune question valable reçue. Réessaie.");
    mem.extra=mem.extra.concat(out).slice(-300);save();
    PF.newCount=out.length;PF.newLevel=level;
    PF.gmsg=out.length+" nouvelles questions ajoutées"+(out.length<arr.length?" ("+(arr.length-out.length)+" refusées car mal formées)":"")+".";
  }).catch(function(e){PF.gmsg="Échec : "+e.message;}).then(function(){PF.busy=false;if(S.view==="parent")render();});
}
function keyTest(){
  var k=($("#ck")||{}).value;if(k!==undefined){mem.set.key=k.trim();mem.set.model=(($("#cm")||{}).value||DEFAULT_MODEL).trim();save();}
  if(!mem.set.key){PF.msg="Entre d’abord une clé.";render();return;}
  PF.busy=true;PF.msg="Test en cours…";render();
  api("Réponds seulement par le mot OK.",20).then(function(t){PF.msg="Connexion réussie : Claude répond.";}).catch(function(e){PF.msg="Échec : "+e.message;}).then(function(){PF.busy=false;if(S.view==="parent")render();});
}

/* ---------- Actions ---------- */
function check(){
  var q=cur(),a=S.ans[q.id];
  if(!hasAns(q,a)){S.msg=q.k==="pass"?"Complète tous les trous, puis valide.":"Réponds d’abord, puis valide.";render();return;}
  S.msg="";
  var g=grade(q,a);
  S.checked=true;S.g=g;
  S.log.push({q:q,a:a,g:g});
  markSeen(q);
  if(g.pts<g.max)addErr(q);else delErr(q);
  save();
  render();
  var fb=$("#fb");if(fb){fb.scrollIntoView({block:"nearest"});}
}
function nextQ(){
  if(S.mode==="train"){
    if(S.i+1>=S.qs.length){finishTrain();return;}
    S.i++;S.checked=false;S.g=null;S.msg="";render(true);
  } else if(S.i+1<S.qs.length){S.i++;S.msg="";render(true);}
}
function themeStats(log){
  var th={};
  log.forEach(function(x){var t=x.q.t;th[t]=th[t]||{p:0,m:0};th[t].p+=x.g.pts;th[t].m+=x.g.max;});
  return th;
}
function starsFor(pct){return pct>=90?3:pct>=75?2:pct>=60?1:0;}
function finishTrain(){
  var pts=0,max=0;S.log.forEach(function(x){pts+=x.g.pts;max+=x.g.max;});
  var pct=max?pts/max*100:0;
  S.res={mode:"train",pts:pts,max:max,stars:starsFor(pct),th:themeStats(S.log),log:S.log,showAll:false};
  S.view="results";render(true);
}
function finishExam(timeout){
  stopTimer();
  var log=S.qs.map(function(q){var a=S.ans[q.id];return {q:q,a:a,g:grade(q,a)};});
  var pts=0,max=0;log.forEach(function(x){pts+=x.g.pts;max+=x.g.max;});
  var pct=max?pts/max*100:0,st=starsFor(pct);
  var used=Math.min(EXAM_MS,Date.now()-S.start);
  log.forEach(function(x){if(hasAnyAns(x.q,x.a))markSeen(x.q);if(x.g.pts<x.g.max)addErr(x.q);});
  var key=S.src+":"+S.level;
  if(!mem.best[key]||pts/max>mem.best[key].pts/mem.best[key].max){mem.best[key]={pts:pts,max:max,stars:st,date:new Date().toISOString()};}
  mem.hist.unshift({level:String(S.level),src:S.src,pts:pts,max:max,date:new Date().toISOString()});
  mem.hist=mem.hist.slice(0,30);
  save();
  S.res={mode:"exam",pts:pts,max:max,stars:st,th:themeStats(log),log:log,used:used,timeout:!!timeout,showAll:false};
  S.view="results";render(true);
}
function goHome(){stopTimer();S={view:"home"};PF.ok=false;render(true);}
function openParent(){stopTimer();S={view:"parent"};PF.a=6+Math.floor(Math.random()*4);PF.b=6+Math.floor(Math.random()*4);PF.err="";PF.gate="";render(true);}
function exportData(){
  var o={v:2,best:mem.best,errors:mem.errors,hist:mem.hist,seen:mem.seen,extra:mem.extra};
  PF.imp=JSON.stringify(o);PF.smsg="Texte exporté ci-dessus : copie-le et garde-le (ou colle-le sur un autre appareil).";render();
  var t=$("#imp");if(t){t.focus();t.select();}
}
function importData(){
  var txt=(($("#imp")||{}).value||PF.imp||"").trim();
  try{
    var o=JSON.parse(txt);
    if(!o||typeof o!=="object"||!o.best)throw new Error("format");
    mem.best=o.best||{};mem.errors=Array.isArray(o.errors)?o.errors:[];mem.hist=Array.isArray(o.hist)?o.hist:[];mem.seen=Array.isArray(o.seen)?o.seen:[];
    if(Array.isArray(o.extra)){var ok=[];o.extra.forEach(function(q,i){var c=cleanQ(q,q&&q.l>=1&&q.l<=4?q.l:2,"i"+i);if(c)ok.push(c);});mem.extra=ok;}
    save();PF.smsg="Progression importée.";
  }catch(e){PF.smsg="Ce texte n’est pas une sauvegarde valable.";}
  render();
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  switch(act){
    case "src":mem.set.src=el.getAttribute("data-s");save();render();break;
    case "theme":THEME=el.getAttribute("data-t");render();break;
    case "train":startTrain(+el.getAttribute("data-l"));break;
    case "exam":var l=el.getAttribute("data-l");startExam(l==="mix"?"mix":+l);break;
    case "errors":startErrors();break;
    case "rules":S={view:"rules"};render(true);break;
    case "home":goHome();break;
    case "parent":openParent();break;
    case "gate":
      var v=(($("#gate")||{}).value||"").trim();
      if(+v===PF.a*PF.b){PF.ok=true;PF.err="";render(true);}else{PF.err="Ce n’est pas la bonne réponse.";render();}
      break;
    case "key-save":
      mem.set.key=((($("#ck")||{}).value)||"").trim();mem.set.model=((($("#cm")||{}).value)||DEFAULT_MODEL).trim()||DEFAULT_MODEL;save();
      PF.ck=undefined;PF.cm=undefined;PF.msg=mem.set.key?"Clé enregistrée sur cette tablette.":"Clé effacée.";render();break;
    case "key-test":keyTest();break;
    case "key-clear":mem.set.key="";PF.ck="";PF.msg="Clé effacée.";save();render();break;
    case "gen-run":genRun();break;
    case "play-claude":mem.set.src="claude";save();THEME="all";startTrain(PF.newLevel||2);break;
    case "extra-clear":mem.extra=[];save();PF.newCount=0;PF.gmsg="Questions de Claude effacées.";if(mem.set.src==="claude")mem.set.src="bank";render();break;
    case "export":exportData();break;
    case "import":importData();break;
    case "reset":PF.confirmReset=true;render();break;
    case "reset-no":PF.confirmReset=false;render();break;
    case "reset-yes":mem.best={};mem.errors=[];mem.hist=[];mem.seen=[];mem.extra=[];if(mem.set.src==="claude")mem.set.src="bank";save();PF.confirmReset=false;PF.smsg="Progression réinitialisée.";PF.newCount=0;render();break;
    case "leave":S.leave=true;render();break;
    case "leave-no":S.leave=false;render();break;
    case "leave-yes":goHome();break;
    case "pick":S.ans[cur().id]=+el.getAttribute("data-i");S.msg="";render();break;
    case "check":check();break;
    case "next":nextQ();break;
    case "prev":if(S.i>0){S.i--;render(true);}break;
    case "goto":S.i=+el.getAttribute("data-n");render(true);break;
    case "finish":S.confirm=true;render();break;
    case "finish-no":S.confirm=false;render();break;
    case "finish-yes":finishExam(false);break;
    case "showall":S.res.showAll=!S.res.showAll;render();break;
    case "again":
      if(S.res.mode==="exam")startExam(S.level);
      else if(S.level)startTrain(S.level);
      else startErrors();
      break;
  }
});
function onInput(e){
  var t=e.target;
  if(t.getAttribute&&t.getAttribute("data-pf")){PF[t.getAttribute("data-pf")]=t.type==="checkbox"?t.checked:t.value;return;}
  if(S.view!=="play"||!S.qs)return;
  var q=cur();
  if(t.id==="ans"){S.ans[q.id]=t.value;S.msg="";}
  else if(t.hasAttribute&&t.hasAttribute("data-b")){
    var i=+t.getAttribute("data-b"),a=S.ans[q.id]||[];
    if(t.tagName==="SELECT")a[i]=t.value===""?undefined:+t.value;else a[i]=t.value;
    S.ans[q.id]=a;S.msg="";
  }
}
document.addEventListener("input",onInput);
document.addEventListener("change",onInput);
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(S.view==="parent"&&!PF.ok&&e.target.id==="gate"){e.preventDefault();var el=$("[data-act=gate]");if(el)el.click();return;}
  if(S.view!=="play"||S.mode!=="train")return;
  if(e.target.closest&&e.target.closest("button"))return;
  e.preventDefault();
  if(S.checked)nextQ();else check();
});
function render(scroll){
  var app=$("#app");
  app.innerHTML=S.view==="home"?viewHome():S.view==="play"?viewPlay():S.view==="results"?viewResults():S.view==="parent"?viewParent():viewRules();
  if(scroll)window.scrollTo(0,0);
}
window.addEventListener("online",function(){if(S.view==="parent"&&PF.ok)render();});
window.addEventListener("offline",function(){if(S.view==="parent"&&PF.ok)render();});
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
render();
})();

</script>
